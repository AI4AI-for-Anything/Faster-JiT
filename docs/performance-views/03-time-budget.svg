  </g>
  <g id="text_17">
   <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #79696b" x="38.88" y="62.496" transform="rotate(-0 38.88 62.496)">Final configuration · kernel time per GPU per step (profiler) · step targets from the full-check baseline</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(38.88 313.788523)">Light segments, left to right (ms): Inductor pointwise / reduction 9.5 · FlexAttention 7.3 · Fused QK norm + RoPE 5.1</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #292122" transform="translate(38.88 326.592)">Fused SwiGLU + bias gradient 4.1 · Communication (NCCL) 3.0 · AdamW + EMA 2.7 · Other 2.0</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(38.88 369.196725)">At 3×, everything except GEMM would have to fit in about 7 ms per step (≈34 ms of kernel time now). GEMMs already run</text>
   <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #79696b" transform="translate(38.88 381.024)">at 90–93% of the measured BF16 matmul peak. Kernel sums overlap and exclude host gaps: an estimate, not a check.</text>
  </g>
